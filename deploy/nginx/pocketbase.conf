server {
    listen 80;
    server_name pb.mbalaundryexpress.com;
    
    location / {
        proxy_pass http://localhost:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS dengan Let's Encrypt (setelah certbot install)
server {
    listen 443 ssl http2;
    server_name pb.mbalaundryexpress.com;
    
    ssl_certificate /etc/letsencrypt/live/pb.mbalaundryexpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pb.mbalaundryexpress.com/privkey.pem;
    
    location / {
        proxy_pass http://localhost:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
