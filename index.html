  <!-- Favicon dipasang SEBELUM render, langsung dari logo yang sudah di-upload.
         Tidak ada ikon default sama sekali: kalau cache belum ada, dipakai ikon
         transparan supaya tab tidak pernah menampilkan logo bawaan. -->
  <script>
    (function () {
      var href = "";
      try {
        var raw = localStorage.getItem("branding_settings");
        if (raw) {
          var b = JSON.parse(raw);
          href = b.favicon_url || b.logo_url || "";
        }
      } catch (e) { }
      if (!href) {
        href =
          "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
      }
      var rels = ["icon", "shortcut icon", "apple-touch-icon"];
      for (var i = 0; i < rels.length; i++) {
        var link = document.createElement("link");
        link.rel = rels[i];
        link.href = href;
        document.head.appendChild(link);
      }
    })();
  </script>
