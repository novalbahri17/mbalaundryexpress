# Nixpacks configuration untuk deploy Dokploy
# -----------------------------------------------------------------------------
# Satu container, satu proses, satu port.
#
#   node server/index.mjs
#     - /api/*      -> REST API (Express + MySQL)
#     - /uploads/*  -> file upload (dilayani API)
#     - /*          -> hasil `vite build` (dist/) + SPA fallback
#
# Tidak perlu Caddy/reverse proxy terpisah: Express mendengarkan PORT dari
# Dokploy dan menyajikan frontend sekaligus backend.

[variables]
# Di-bake saat `pnpm build`, jadi harus ada di sini (env dashboard tidak
# selalu ikut ter-bake ke bundle Vite).
VITE_API_BASE_PATH = '/api'
VITE_PUBLIC_PATH = '/'
VITE_SITE_URL = 'https://mbalaundryexpress.com'
VITE_SITE_NAME = 'MBA Laundry Express'
# CATATAN: NODE_ENV sengaja TIDAK ditaruh di sini. Kalau di-set saat build,
# pnpm bisa melewati devDependencies (vite & typescript ada di sana) sehingga
# `pnpm build` gagal. Set NODE_ENV=production dari dashboard Dokploy (runtime).

[start]
cmd = 'node server/index.mjs'
